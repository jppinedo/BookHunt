<html lang="en">
  <head>

    <!-- No favicon file here on purpose: referencing BookHuntLogoSmall.png
         from this HTML forced Vite to emit it as a file, which defeated
         the data-URI inlining of the same image in the JS bundle. The
         published preview shell (artifact index.html) declares its own
         favicon against its own copy of the file. -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Hunt</title>
  </head>
  <body id="bh-body">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
